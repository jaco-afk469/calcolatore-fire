<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="postBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="60%" stop-color="#071529"/>
      <stop offset="100%" stop-color="#040A14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0D1B33"/>
    </linearGradient>
    <linearGradient id="brandLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E56A0"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#postBg)"/>

  <!-- Subtle glow orb -->
  <circle cx="850" cy="220" r="320" fill="#1E56A0" opacity="0.16" filter="blur(90px)"/>
  <circle cx="200" cy="880" r="280" fill="#4A90E2" opacity="0.12" filter="blur(80px)"/>

  <!-- Top Bar: Brand -->
  <g transform="translate(80, 80)">
    <rect width="52" height="52" rx="14" fill="url(#brandLogo)" stroke="#4A90E2" stroke-width="1.5"/>
    <polyline points="38,15 24,31 16,23 8,32" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="29,15 38,15 38,24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="70" y="34" font-family="'Poppins', system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
      FinCalcolatore
    </text>

    <!-- Badge -->
    <rect x="740" y="8" width="180" height="36" rx="18" fill="rgba(74, 144, 226, 0.15)" stroke="#4A90E2" stroke-width="1"/>
    <text x="830" y="32" font-family="'Poppins', system-ui, sans-serif" font-size="13" font-weight="700" fill="#4A90E2" text-anchor="middle">
      CASO STUDIO PAC
    </text>
  </g>

  <!-- Main Question / Hook -->
  <text x="80" y="220" font-family="'Poppins', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
    Cosa succede se investi
  </text>
  <text x="80" y="278" font-family="'Poppins', system-ui, sans-serif" font-size="44" font-weight="800" fill="#4A90E2" letter-spacing="-0.02em">
    250€ al mese in un PAC ETF?
  </text>
  <text x="80" y="330" font-family="'Poppins', system-ui, sans-serif" font-size="20" font-weight="500" fill="#94A3B8">
    Simulazione reale a 25 anni con rendimento medio storico dell'8% annuo.
  </text>

  <!-- Big Central Card -->
  <g transform="translate(80, 380)" filter="url(#cardShadow)">
    <rect width="920" height="470" rx="24" fill="url(#cardGrad)" stroke="#233554" stroke-width="2"/>

    <!-- Row 1: Capitale Versato -->
    <g transform="translate(50, 50)">
      <text x="0" y="24" font-family="'Poppins', system-ui, sans-serif" font-size="18" font-weight="600" fill="#94A3B8">
        1. Capitale Versato di Tasca Tua
      </text>
      <text x="0" y="66" font-family="'Poppins', system-ui, sans-serif" font-size="36" font-weight="800" fill="#CBD5E1">
        75.000 €
      </text>
      <text x="820" y="66" font-family="'Poppins', system-ui, sans-serif" font-size="16" font-weight="500" fill="#64748B" text-anchor="end">
        (300 versamenti da 250€)
      </text>
    </g>

    <!-- Divider Line -->
    <line x1="50" y1="160" x2="870" y2="160" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Row 2: Interessi Composti Generati -->
    <g transform="translate(50, 195)">
      <text x="0" y="24" font-family="'Poppins', system-ui, sans-serif" font-size="18" font-weight="600" fill="#4A90E2">
        2. Interessi Composti Generati dal Mercato
      </text>
      <text x="0" y="66" font-family="'Poppins', system-ui, sans-serif" font-size="36" font-weight="800" fill="#4A90E2">
        +163.450 €
      </text>
      <text x="820" y="66" font-family="'Poppins', system-ui, sans-serif" font-size="16" font-weight="700" fill="#3B82F6" text-anchor="end">
        +218% sui soldi versati!
      </text>
    </g>

    <!-- Divider Line -->
    <line x1="50" y1="305" x2="870" y2="305" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Row 3: Totale Patrimonio Finale -->
    <g transform="translate(50, 340)">
      <text x="0" y="24" font-family="'Poppins', system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
        Patrimonio Totale Raggiunto:
      </text>
      <text x="0" y="80" font-family="'Poppins', system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-0.02em">
        238.450 €
      </text>
      <rect x="660" y="32" width="160" height="42" rx="12" fill="#1E56A0"/>
      <text x="740" y="58" font-family="'Poppins', system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        3,2x il Capitale
      </text>
    </g>
  </g>

  <!-- Bottom CTA Pill Footer -->
  <g transform="translate(80, 910)">
    <rect width="920" height="80" rx="20" fill="#1E56A0"/>
    <text x="460" y="48" font-family="'Poppins', system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      👉 Calcola gratis il tuo piano su fincalcolatore.vercel.app (Link in Bio)
    </text>
  </g>
</svg>
