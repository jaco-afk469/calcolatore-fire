<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="fbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="60%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4A90E2" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E56A0" stroke-width="0.7" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#fbBg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="200" r="280" fill="#1E56A0" opacity="0.18" filter="blur(80px)"/>
  <circle cx="200" cy="500" r="220" fill="#4A90E2" opacity="0.1" filter="blur(60px)"/>

  <!-- Background Growth Curve Chart Art -->
  <path d="M 550 520 Q 750 480 880 340 T 1150 120" fill="none" stroke="#4A90E2" stroke-width="4" opacity="0.4"/>
  <path d="M 550 520 Q 750 480 880 340 T 1150 120 L 1150 560 L 550 560 Z" fill="url(#blueGlow)" opacity="0.15"/>

  <!-- Left Content: Brand & Identity -->
  <!-- Logo Icon -->
  <g transform="translate(100, 100)">
    <rect width="84" height="84" rx="22" fill="url(#logoGrad)" stroke="#4A90E2" stroke-width="2"/>
    <polyline points="60,24 38,48 26,36 12,50" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="46,24 60,24 60,38" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Title -->
  <text x="204" y="158" font-family="'Poppins', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
    FinCalcolatore
  </text>
  <rect x="580" y="128" width="90" height="28" rx="14" fill="rgba(74, 144, 226, 0.18)" stroke="#4A90E2" stroke-width="1"/>
  <text x="625" y="147" font-family="'Poppins', system-ui, sans-serif" font-size="12" font-weight="700" fill="#4A90E2" text-anchor="middle">ONLINE</text>

  <!-- Main Headline -->
  <text x="100" y="250" font-family="'Poppins', system-ui, sans-serif" font-size="38" font-weight="700" fill="#F8F9FA" letter-spacing="-0.01em">
    Pianifica la tua Libertà Finanziaria.
  </text>
  <text x="100" y="295" font-family="'Poppins', system-ui, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    Simulazioni quantitative, fiscalità italiana aggiornata e zero consulenze opache.
  </text>

  <!-- Feature Pills Grid -->
  <g transform="translate(100, 350)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="10" fill="#112240" stroke="#233554" stroke-width="1.5"/>
    <text x="24" y="30" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">📈 PAC &amp; Interesse Comp.</text>

    <!-- Pill 2 -->
    <rect x="236" y="0" width="210" height="48" rx="10" fill="#112240" stroke="#233554" stroke-width="1.5"/>
    <text x="260" y="30" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">🏛️ Fondo Pensione vs ETF</text>

    <!-- Pill 3 -->
    <rect x="462" y="0" width="190" height="48" rx="10" fill="#112240" stroke="#233554" stroke-width="1.5"/>
    <text x="486" y="30" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">🏠 Affitto vs Mutuo</text>

    <!-- Pill 4 -->
    <rect x="668" y="0" width="175" height="48" rx="10" fill="#112240" stroke="#233554" stroke-width="1.5"/>
    <text x="692" y="30" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">🔥 Metodo FIRE 4%</text>
  </g>

  <!-- Bottom CTA Banner -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="480" height="58" rx="14" fill="#1E56A0"/>
    <text x="240" y="36" font-family="'Poppins', system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      🌐 Visita fincalcolatore.vercel.app →
    </text>
  </g>

  <!-- Independent Badge -->
  <text x="100" y="555" font-family="'Poppins', system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748B">
    100% Gratuito • Nessuna Registrazione • Privacy by Design
  </text>
</svg>
