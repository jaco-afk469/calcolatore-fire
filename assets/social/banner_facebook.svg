<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="fbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="50%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#040812"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E56A0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E56A0" stroke-width="0.7" opacity="0.12"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#1E56A0" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#fbBg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Centered Ambient Glow Orbs -->
  <circle cx="600" cy="220" r="320" fill="#1E56A0" opacity="0.22" filter="blur(90px)"/>
  <circle cx="250" cy="450" r="240" fill="#4A90E2" opacity="0.12" filter="blur(80px)"/>
  <circle cx="950" cy="450" r="240" fill="#4A90E2" opacity="0.12" filter="blur(80px)"/>

  <!-- Brand Block Centered (X=600) -->
  <g transform="translate(600, 110)">
    <!-- Logo Emblem Centered -->
    <g transform="translate(-190, -42)" filter="url(#glow)">
      <rect width="72" height="72" rx="18" fill="url(#logoGrad)" stroke="#4A90E2" stroke-width="2"/>
      <polyline points="52,20 34,42 24,32 12,44" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="40,20 52,20 52,32" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Brand Name Centered -->
    <text x="-95" y="10" font-family="'Poppins', system-ui, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
      FinCalcolatore
    </text>

    <!-- Online Pill Badge -->
    <rect x="235" y="-18" width="84" height="26" rx="13" fill="rgba(74, 144, 226, 0.18)" stroke="#4A90E2" stroke-width="1"/>
    <text x="277" y="-1" font-family="'Poppins', system-ui, sans-serif" font-size="11" font-weight="700" fill="#4A90E2" text-anchor="middle">ONLINE</text>
  </g>

  <!-- Main Headline Centered -->
  <text x="600" y="225" font-family="'Poppins', system-ui, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.01em">
    Pianifica la tua Libertà Finanziaria.
  </text>
  <text x="600" y="272" font-family="'Poppins', system-ui, sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="middle">
    Simulazioni quantitative, fiscalità italiana 2026 e zero consulenze opache.
  </text>

  <!-- 4 Feature Pills Centered (Total width = 940, Start X = (1200 - 940)/2 = 130) -->
  <g transform="translate(130, 335)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="50" rx="12" fill="#112240" stroke="#233554" stroke-width="1.5"/>
    <text x="110" y="32" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">PAC &amp; Interesse Comp.</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="50" rx="12" fill="#112240" stroke="#233554" stroke-width="1.5"/>
    <text x="350" y="32" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Fondo Pensione vs ETF</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="50" rx="12" fill="#112240" stroke="#233554" stroke-width="1.5"/>
    <text x="590" y="32" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Affitto vs Mutuo</text>

    <!-- Pill 4 -->
    <rect x="720" y="0" width="220" height="50" rx="12" fill="#112240" stroke="#233554" stroke-width="1.5"/>
    <text x="830" y="32" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Metodo FIRE 4%</text>
  </g>

  <!-- CTA Button Centered (Width 460, X = (1200-460)/2 = 370) -->
  <g transform="translate(370, 440)" filter="url(#glow)">
    <rect width="460" height="60" rx="16" fill="#1E56A0"/>
    <text x="230" y="38" font-family="'Poppins', system-ui, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      Visita fincalcolatore.vercel.app →
    </text>
  </g>

  <!-- Bottom Trust Badge Centered -->
  <text x="600" y="555" font-family="'Poppins', system-ui, sans-serif" font-size="15" font-weight="500" fill="#64748B" text-anchor="middle">
    100% Gratuito • Nessuna Registrazione • Privacy by Design
  </text>
</svg>
