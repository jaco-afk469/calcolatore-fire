<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#050C18"/>
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1E56A0"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E56A0" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Circular Safe-Zone Ambient Glow -->
  <circle cx="512" cy="512" r="420" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
  <circle cx="512" cy="512" r="460" fill="none" stroke="#1E56A0" stroke-width="1.5" stroke-dasharray="10 14" opacity="0.4"/>

  <!-- Centered Floating Squircle Emblem -->
  <g filter="url(#glow)">
    <rect x="232" y="232" width="560" height="560" rx="140" fill="url(#emblemGrad)" stroke="#4A90E2" stroke-width="3" stroke-opacity="0.4"/>
  </g>

  <!-- Upward Compound Growth Polyline -->
  <polyline points="656,368 476,548 376,448 276,548" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow Head -->
  <polyline points="526,368 656,368 656,498" fill="none" stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtitle Accent Dots -->
  <circle cx="512" cy="850" r="8" fill="#4A90E2"/>
  <circle cx="482" cy="850" r="5" fill="#1E56A0" opacity="0.6"/>
  <circle cx="542" cy="850" r="5" fill="#1E56A0" opacity="0.6"/>
</svg>
