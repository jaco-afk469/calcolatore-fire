<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="surgeStem" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="surgeTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="surgeMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="surgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Sfondo dark navy squircle -->
  <rect width="100" height="100" rx="22" fill="#0A192F" stroke="#233554" stroke-width="1.5"/>

  <!-- Logo 1C: Kinetic Surge F -->
  <g filter="url(#surgeGlow)">
    <!-- 1. Asta Verticale Solida (Arrotondata sopra e con taglio inclinato a 45° sotto) -->
    <path d="M 22 26 C 22 22.7 24.7 20 28 20 L 37 20 C 40.3 20 43 22.7 43 26 L 43 70 L 31 82 C 28.5 84.5 22 82.5 22 78 Z" fill="url(#surgeStem)"/>

    <!-- 2. Trave Superiore Slanciata: Freccia Cinetica Integrata -->
    <!-- Corpo orizzontale che si trasforma in freccia a Nord-Est -->
    <path d="M 43 20 L 72 20 C 74 20 75.8 21.2 76.5 23 L 83.5 40 C 84.8 43 81.5 45.5 79 43.5 L 72 37 L 72 34 L 43 34 Z" fill="url(#surgeTop)"/>
    <!-- Freccia Cuspide a 45° perfetta -->
    <path d="M 58 14 L 84 14 C 86.2 14 88 15.8 88 18 L 88 44 C 88 46.5 85 47.8 83 45.8 L 76 38.8 L 60 54.8 C 58.5 56.3 56 56.3 54.5 54.8 L 51 51.3 C 49.5 49.8 49.5 47.3 51 45.8 L 67 29.8 L 60 22.8 C 58 20.8 59.5 14 58 14 Z" fill="url(#surgeTop)"/>

    <!-- 3. Trave Mediana: Cuneo Aerodinamico Parallelo -->
    <path d="M 43 47 L 63 47 C 65.5 47 67.2 49.5 66 52 L 60 63 C 59 64.5 57.5 65 55.5 65 L 43 65 Z" fill="url(#surgeMid)"/>
  </g>
</svg>
