<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="razorGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="80%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="razorMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="razorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2563EB" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sfondo dark navy squircle -->
  <rect width="100" height="100" rx="22" fill="#0A192F" stroke="#233554" stroke-width="1.5"/>

  <!-- Logo 1A: Razor Kinetic F -->
  <g filter="url(#razorGlow)">
    <!-- Asta Verticale Portante con taglio geometrico a 45° alla base -->
    <path d="M 22 24 C 22 21.8 23.8 20 26 20 L 36 20 C 38.2 20 40 21.8 40 24 L 40 74 L 28 82 C 24.5 84.3 22 81.8 22 78 Z" fill="url(#razorGrad)"/>

    <!-- Braccio Superiore: Freccia Cinetica Integrata a 45° -->
    <!-- Parte dal pilastro, si allunga orizzontalmente e svetta verso l'alto a Nord-Est -->
    <path d="M 40 20 L 68 20 L 84 20 C 86.2 20 87.5 22.5 86 24.2 L 78 33.5 L 82 33.5 C 84 33.5 85.5 35.5 84.5 37.2 L 75 52 L 67 44 L 71 38 L 40 38 Z" fill="url(#razorGrad)"/>

    <!-- Braccio Mediano: Ala Aerodinamica di Compounding -->
    <path d="M 40 48 L 62 48 C 64.5 48 66 50.5 64.5 52.5 L 56 62 C 54.8 63.5 53 64 51 64 L 40 64 Z" fill="url(#razorMid)"/>
  </g>
</svg>
