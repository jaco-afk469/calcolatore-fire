<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ribStem" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0F2E59"/>
      <stop offset="50%" stop-color="#1E56A0"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="ribTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="ribMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="ribGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#38BDF8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0A192F" stroke="#233554" stroke-width="1.5"/>

  <!-- Logo 1B: Ribbon Fold F -->
  <g filter="url(#ribGlow)">
    <!-- Asta Verticale -->
    <path d="M 22 78 L 22 26 C 22 22.7 24.7 20 28 20 L 38 20 L 38 78 C 38 80.2 36.2 82 34 82 L 26 82 C 23.8 82 22 80.2 22 78 Z" fill="url(#ribStem)"/>

    <!-- Piegatura / Raccordo d'angolo tra asta e braccio superiore -->
    <path d="M 22 26 C 22 22.7 24.7 20 28 20 L 46 20 L 38 34 L 22 34 Z" fill="#3B82F6" opacity="0.9"/>

    <!-- Braccio Superiore con Freccia Slanciata a Nord-Est -->
    <path d="M 38 20 L 72 20 L 84 20 C 86.5 20 87.8 23 86 25 L 76 34 L 72 34 L 38 34 Z" fill="url(#ribTop)"/>
    <!-- Cuspide della freccia verso l'alto -->
    <polygon points="68,14 86,14 86,32 78,24 64,38 58,32 72,18" fill="#FFFFFF"/>

    <!-- Braccio Mediano Fluttuante con taglio a gemma -->
    <path d="M 38 48 L 64 48 C 66.5 48 68 50.5 66.5 52.5 L 59 62 L 38 62 Z" fill="url(#ribMid)"/>
  </g>
</svg>
