<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="prismA" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="prismB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="prismC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="c2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1E56A0" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Sfondo dark navy rounded -->
  <rect width="100" height="100" rx="22" fill="#0A192F" stroke="#233554" stroke-width="1.5"/>

  <!-- Prisma Delta Geometrico Tridimensionale -->
  <g filter="url(#c2Glow)">
    <!-- Facetta Sinistra: Il Capitale (Pilastro di supporto) -->
    <polygon points="50,18 20,78 35,78 55,34" fill="url(#prismA)"/>

    <!-- Facetta Destra: Il Compounding (Traiettoria ascendente slanciata) -->
    <polygon points="50,18 55,34 76,78 64,78 48,46" fill="url(#prismB)"/>

    <!-- Trave Base: Il Tempo (Connessione orizzontale) -->
    <polygon points="26,72 74,72 68,82 20,82" fill="url(#prismA)" opacity="0.85"/>

    <!-- Nucleo di Luce Centrale: Il Delta matematico -->
    <polygon points="50,30 36,65 64,65" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
