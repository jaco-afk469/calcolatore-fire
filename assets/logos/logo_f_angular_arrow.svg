<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="angGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="85%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="angMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="angGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sfondo dark navy squircle -->
  <rect width="100" height="100" rx="22" fill="#0A192F" stroke="#233554" stroke-width="1.5"/>

  <!-- Logo Evolution: Angular Arrow F -->
  <g filter="url(#angGlow)">
    <!-- 1. Asta Verticale con smusso a 45° in basso -->
    <path d="M 22 26 C 22 22.7 24.7 20 28 20 L 37 20 C 40.3 20 43 22.7 43 26 L 43 72 L 31 82 C 29 83.5 25.5 83 23.5 81 C 22.5 80 22 78.5 22 77 Z" fill="#1E56A0"/>

    <!-- 2. Braccio Superiore Freccia a 45°: Disegna la traversa della F e si stacca in una freccia pura -->
    <!-- Segmento orizzontale di connessione -->
    <path d="M 43 20 L 64 20 L 50 34 L 43 34 Z" fill="#2563EB"/>
    <!-- Grande Freccia a Nord-Est Slanciata (Integrazione perfetta del braccio) -->
    <path d="M 52 14 L 84 14 C 86.2 14 88 15.8 88 18 L 88 50 L 76 38 L 58 56 L 46 44 L 64 26 Z" fill="url(#angGrad)"/>

    <!-- 3. Braccio Mediano: Chevron Orizzontale Parallelo -->
    <path d="M 43 47 L 65 47 L 53 59 L 43 59 Z" fill="url(#angMid)"/>
  </g>
</svg>
