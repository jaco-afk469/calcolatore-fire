<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="c3Needle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="c3Ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E56A0" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="c3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sfondo rounded -->
  <rect width="100" height="100" rx="22" fill="#0A192F" stroke="#233554" stroke-width="1.5"/>

  <!-- Cerchio di Precisione Finanziaria -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="url(#c3Ring)" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Bussola / Freccia Nord-Est a Doppia Lama Geometrica -->
  <g filter="url(#c3Glow)">
    <!-- Ala Superiore (Luminosa verso il futuro) -->
    <polygon points="50,50 78,22 48,34" fill="#FFFFFF"/>
    <!-- Ala Destra (Gradiente di crescita) -->
    <polygon points="50,50 78,22 66,52" fill="url(#c3Needle)"/>
    <!-- Coda Opposta (Ancoraggio del capitale iniziale) -->
    <polygon points="50,50 22,78 34,48" fill="#1E56A0"/>
    <polygon points="50,50 22,78 52,66" fill="#0F2C59"/>
    <!-- Perno Centrale Brillante -->
    <circle cx="50" cy="50" r="4.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
</svg>
