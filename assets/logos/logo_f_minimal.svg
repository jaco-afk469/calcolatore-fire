<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="minGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="minGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1E56A0" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Sfondo dark navy squircle -->
  <rect width="100" height="100" rx="22" fill="#0A192F" stroke="#233554" stroke-width="1.5"/>

  <!-- Logo 1D: Pure Minimalist Compounding F -->
  <g filter="url(#minGlow)">
    <!-- 1. Asta Verticale Portante -->
    <rect x="22" y="22" width="14" height="56" rx="7" fill="url(#minGrad)"/>

    <!-- 2. Braccio Superiore con Freccia Nord-Est Slanciata -->
    <path d="M 36 29 L 68 29 L 58 19 L 66 19 L 81 34 L 66 49 L 58 49 L 68 39 L 36 39 Z" fill="#FFFFFF"/>
    <path d="M 36 29 L 68 29 L 68 39 L 36 39 Z" fill="url(#minGrad)"/>
    <!-- Freccia Cuspide a Nord-Est pura -->
    <polygon points="60,18 82,18 82,40 73,31 59,45 52,38 66,24" fill="#60A5FA"/>
    <polygon points="63,21 79,21 79,37 72,30 60,42 55,37 67,25" fill="#FFFFFF"/>

    <!-- 3. Braccio Mediano Parallelo e Pulito -->
    <rect x="36" y="50" width="28" height="10" rx="5" fill="url(#minGrad)"/>
  </g>
</svg>
