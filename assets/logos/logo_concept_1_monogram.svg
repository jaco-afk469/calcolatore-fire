<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="c1Grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E56A0"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="c1Accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="c1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E56A0" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Sfondo dark navy premium arrotondato -->
  <rect width="100" height="100" rx="22" fill="#0A192F" stroke="#233554" stroke-width="1.5"/>

  <!-- Monogramma F Esponenziale -->
  <g filter="url(#c1Glow)">
    <!-- Asta verticale solida (La base patrimoniale) -->
    <rect x="20" y="20" width="16" height="60" rx="6" fill="url(#c1Grad)"/>

    <!-- Braccio superiore con freccia di accelerazione integrata -->
    <path d="M 36 20 L 76 20 C 79 20 81 23 80 26 L 74 36 C 73 38 70 39 68 39 L 36 39 Z" fill="url(#c1Grad)"/>

    <!-- Freccia dinamica ascendente innestata nel vertice -->
    <polygon points="70,14 86,14 86,30 80,24 64,40 58,34 74,18" fill="url(#c1Accent)"/>

    <!-- Braccio mediano a cuneo geometrico (L'interesse composto intermedio) -->
    <path d="M 36 47 L 62 47 C 65 47 67 50 66 52 L 61 61 C 60 63 58 64 56 64 L 36 64 Z" fill="url(#c1Grad)"/>
  </g>
</svg>
